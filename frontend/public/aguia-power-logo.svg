<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">Grupo Águia Power</title>
  <desc id="desc">Emblema azul com uma águia branca em voo e o nome Grupo Águia Power.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#029cf5"/>
      <stop offset="1" stop-color="#1b2a89"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91ceee"/>
      <stop offset="1" stop-color="#5494cd"/>
    </linearGradient>
  </defs>

  <g transform="translate(20 10)">
    <path d="M145 8 260 57v85c0 71-43 121-115 159C73 263 30 213 30 142V57L145 8Z" fill="url(#shield)" stroke="#1b2a89" stroke-width="8" stroke-linejoin="round"/>
    <path d="M145 24 245 67v75c0 61-36 104-100 140-64-36-100-79-100-140V67l100-43Z" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round" opacity=".9"/>
    <image x="42" y="77" width="206" height="179" href="aguia-branca.png" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="340" y="111" fill="#5494cd" font-size="24" font-weight="700" letter-spacing="7">GRUPO</text>
    <text x="334" y="194" fill="#1b2a89" font-size="76" font-weight="800" letter-spacing="-3">ÁGUIA</text>
    <text x="340" y="244" fill="#029cf5" font-size="35" font-weight="700" letter-spacing="9">POWER</text>
    <path d="M340 267h550" stroke="#d4ddea" stroke-width="2"/>
    <text x="340" y="294" fill="#4a5568" font-size="16" font-weight="600" letter-spacing="3">GESTÃO • OPERAÇÃO • SEGURANÇA</text>
  </g>
</svg>
